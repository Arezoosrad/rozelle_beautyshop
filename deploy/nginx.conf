server {
    listen 80;
    client_max_body_size 20m;
    location /static/ { alias /static/; }
    location /media/ { alias /media/; }
    location / { proxy_pass http://web:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
